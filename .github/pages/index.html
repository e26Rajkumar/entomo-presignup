<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ministry of Labour Digital Workforce Hub | Pre-signup</title>
    <!-- Root of the GitHub Pages site (copied in by .github/workflows/pages.yml).
         Links are relative so they work under /<repo>/ and on a custom domain. -->
    <link rel="icon" href="v1/favicon.ico" sizes="32x32" />
    <link rel="icon" href="v1/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --blue: #3464b0;
        --text: #111111;
        --muted: #555555;
        --bg: #f7f7f5;
        --card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f2f2f2;
          --muted: #b5b5b5;
          --bg: #111111;
          --card: #1c1c1c;
          --border: rgba(255, 255, 255, 0.12);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 560px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      a {
        display: block;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--blue);
      }
      a strong {
        color: var(--blue);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Digital Workforce Hub: pre-signup pages</h1>
      <p>Three design versions of the same page.</p>
      <ul>
        <li><a href="v1/"><strong>Version 1</strong> — photo carousel hero</a></li>
        <li><a href="v2/"><strong>Version 2</strong> — light editorial layout</a></li>
        <li><a href="v3/"><strong>Version 3</strong> — dark, bold layout</a></li>
      </ul>
    </main>
  </body>
</html>
